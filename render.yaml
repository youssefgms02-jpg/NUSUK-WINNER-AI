databases:
  - name: nusuk-winner-ai-db
    plan: free
    databaseName: nusuk
    user: nusuk

services:
  - type: web
    name: nusuk-winner-ai-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nusuk-winner-ai-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://nusuk-winner-ai.vercel.app,https://nusuk-winner-ai-tigeroz-s-projects.vercel.app
